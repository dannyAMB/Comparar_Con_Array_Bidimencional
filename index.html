<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Datos de Excel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
        }

.header_content{

width: 100%;
position: fixed;
top: 0;
}
/* botones login */
.content-login{

width: 100%;
display: flex;
justify-content: right;

}

.content-login-api_botom{
display: flex;
margin: 4px;

}
/* fin botones login */
        input[type="file"] {
    margin: 20px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fff;
}
        .container {
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .box {
         
        
            width: 90%;
   display: flex;
   flex-wrap: wrap;
    margin: 10px 0;
    padding: 15px;
    border-radius: 8px;
    background-color: #fff;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .container_content{
         
        
            width: 100%;
            padding: 10px;
            border-radius: 20px;

     }
        .coincidencias {
            background-color: #d4edda;
    border: 1px solid #c3e6cb;
    color: #155724;
         
        }
        .diferencias {
            background-color: #f8d7da;
    border: 1px solid #f5c6cb;
    color: #721c24;
            
             }
            h4{

                width: 100%;    
            }
    </style>
</head>
<body>
    <header class="header_content">

        <div class="content-login">
    
    
          <div class="content-login-api_botom">
            <button id="authorize_button" class="btn btn-outline-danger" >Get data</button>
            <button id="signout_button"   class="btn btn-outline-danger"   >Sign-off</button>
          </div>
        </div>
      
       
    </header>
   <main>
    <h2>Comparar Datos de una Columna con Excel</h2>
    <input type="file" id="fileInput" accept=".xlsx">
    <div class="container">
        <div class="box">
            <h3>Coincidencias</h3>
           <div class="coincidencias container_content"> <ul id="coincidenciasList"></ul>
        </div>
          
          
            
        </div>
        <div class="box">
            <h3>No Coincidencias</h3>
            <div class="diferencias container_content">

                <ul id="diferenciasList">
                  
                </ul>
            </div>
            
        </div>
    </div>
   </main> 
  

   
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
      <script type="module" src="JS/conection-api-key.js"></script>
      <script async defer src="https://apis.google.com/js/api.js" id="gapi" ></script>

      <script async defer src="https://accounts.google.com/gsi/client" id="gis" ></script>

</body>
</html>
